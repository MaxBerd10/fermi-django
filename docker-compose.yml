services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fermi
      POSTGRES_USER: fermi
      POSTGRES_PASSWORD: fermi_dev_only
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fermi"]
      interval: 3s
      timeout: 3s
      retries: 10

  # No Redis service here — this machine already runs a local Redis for other
  # projects (port 6379). We reuse it with a dedicated DB index (see .env) instead
  # of running a second instance.

volumes:
  pgdata:
